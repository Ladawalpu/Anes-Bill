<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2284AD">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>AnesBill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: sticky app bar + tabs; phone = one column with a sticky action bar, desktop = form | picker (sender) and queue | worksheet (keyer). */
:root{
  --bg:#eef3f6; --surface:#ffffff; --surface2:#f5f8fa; --ink:#13202a; --muted:#566874; --line:#d3dee5;
  --accent:#2284AD; --accent-soft:#e0eff7; --accent-ink:#ffffff; --accent-deep:#155a7a;
  --pending:#a8650a; --pending-soft:#fbefd9; --keying:#6a46b5; --keying-soft:#ece6f8;
  --done:#2b7a3a; --done-soft:#dff1e2; --bad:#b3261e; --bad-soft:#fbe3e1; --mute-soft:#e7edf1;
  --g0:#1a6896; --g1:#8f3a10; --g2:#2c6a1c; --g3:#7b2677; --g4:#8a5d00; --g5:#0b6a6a; --g6:#a0233f; --g7:#4146a3;
  --shadow:0 1px 2px rgba(19,32,42,.06),0 4px 14px rgba(19,32,42,.06);
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --surface:#172026; --surface2:#1c262d; --ink:#e3ebf0; --muted:#98a9b4; --line:#2a3640;
  --accent:#5fb3dc; --accent-soft:#14303f; --accent-ink:#04141d; --accent-deep:#9fd4ef;
  --pending:#e7a94a; --pending-soft:#3a2b14; --keying:#b39cf0; --keying-soft:#2a2140;
  --done:#71c482; --done-soft:#17321d; --bad:#f08a80; --bad-soft:#3d1a18; --mute-soft:#222c33;
  --g0:#7cc3ea; --g1:#f2a47c; --g2:#97d483; --g3:#e5a0e2; --g4:#e9c45f; --g5:#6dd6d4; --g6:#f48fa9; --g7:#aeb2f7;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1418; --surface:#172026; --surface2:#1c262d; --ink:#e3ebf0; --muted:#98a9b4; --line:#2a3640;
  --accent:#5fb3dc; --accent-soft:#14303f; --accent-ink:#04141d; --accent-deep:#9fd4ef;
  --pending:#e7a94a; --pending-soft:#3a2b14; --keying:#b39cf0; --keying-soft:#2a2140;
  --done:#71c482; --done-soft:#17321d; --bad:#f08a80; --bad-soft:#3d1a18; --mute-soft:#222c33;
  --g0:#7cc3ea; --g1:#f2a47c; --g2:#97d483; --g3:#e5a0e2; --g4:#e9c45f; --g5:#6dd6d4; --g6:#f48fa9; --g7:#aeb2f7;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-top{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand-logo{width:30px;height:30px;flex:none;display:block}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.who-chip{border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));background:var(--accent-soft);color:var(--accent-deep);font-weight:600;border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw;display:inline-flex;align-items:center;gap:7px}
.who-chip .av{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.who-chip.unset{background:var(--pending-soft);color:var(--pending);border-color:color-mix(in srgb,var(--pending) 45%,var(--line))}
.who-chip.unset .av{background:var(--pending)}
.nm{font-weight:600}
.nm-send{color:var(--accent-deep)} .nm-doc{color:var(--g1);font-weight:600}
.nm-keying{color:var(--keying)} .nm-done{color:var(--done)} .nm-other{color:var(--g3)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;font-weight:500;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--pending-soft);color:var(--pending);font-size:12px;font-weight:600}
.banner{background:var(--pending-soft);color:var(--ink);font-size:13px;padding-block:6px}
.banner b{color:var(--pending)}

main{padding-block:16px 120px}
h2{font-family:var(--f-display);font-size:19px;margin:0 0 4px;text-wrap:balance;color:var(--accent-deep)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.label{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:block}
.field{display:flex;flex-direction:column;min-width:0}
.input,select.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;min-height:42px}
.tm{font-size:18px;letter-spacing:.06em}
.input[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;min-height:42px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.small{min-height:32px;padding:4px 10px;font-size:13px}
.btn[data-close]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--accent-deep);font-weight:600}
.btn[data-close]:hover{background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.btn.addmore{background:var(--g2);border-color:var(--g2);color:var(--surface);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn.addmore:hover{filter:brightness(1.1)}
.btn.addmore b{font-size:18px;line-height:1}
.mfoot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));z-index:2;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center;
  margin:14px calc(-1 * max(16px,env(safe-area-inset-right,0px))) calc(-18px - env(safe-area-inset-bottom,0px)) calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--surface);border-top:1px solid var(--line)}
.mfoot .sp{margin-right:auto}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
/* หมวดรายการ: สีเข้มประจำหมวด วนซ้ำทุก 8 หมวด */
.gc0{--gc:var(--g0)}.gc1{--gc:var(--g1)}.gc2{--gc:var(--g2)}.gc3{--gc:var(--g3)}.gc4{--gc:var(--g4)}.gc5{--gc:var(--g5)}.gc6{--gc:var(--g6)}.gc7{--gc:var(--g7)}
.chip.gc{color:var(--gc);font-weight:600;border-color:color-mix(in srgb,var(--gc) 40%,var(--line));background:color-mix(in srgb,var(--gc) 9%,var(--surface))}
.chip.gc[aria-pressed="true"]{background:var(--gc);border-color:var(--gc);color:var(--surface);font-weight:700}
.chip.gc .c{opacity:1;font-weight:700}
.grp-h.gc{color:var(--gc);font-weight:700;background:color-mix(in srgb,var(--gc) 8%,var(--surface2))}
.chip .c{font-size:12px;opacity:.8;margin-left:4px}

/* sender */
.send-grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.timebox{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:var(--surface2);border:1px dashed var(--line);border-radius:9px;padding:8px 12px;font-size:14px}
.timebox b{font-family:var(--f-mono);font-size:16px}
.now{font-size:12px;border:0;background:none;color:var(--accent);font-weight:600;padding:0 2px;margin-left:6px}
.picker{display:flex;flex-direction:column;gap:12px;min-width:0}
.search{position:relative}
.search input{padding-left:36px}
.search svg{position:absolute;left:11px;top:12px;width:18px;height:18px;color:var(--muted)}
.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it.on{background:var(--accent-soft)}
.it-name{font-weight:500;overflow-wrap:anywhere}
.it-meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px;background:var(--mute-soft);color:var(--muted)}
.tag.auto{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--bad-soft);color:var(--bad)}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.step button{width:38px;height:38px;border:0;background:var(--surface2);font-size:20px;line-height:1}
.step input{width:46px;height:38px;border:0;text-align:center;font-family:var(--f-mono);font-weight:600;background:transparent;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{display:none}
.grp-h{padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface2);border-top:1px solid var(--line);letter-spacing:.03em}
.grp-h:first-child{border-top:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom,0px)}
.actionbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.ab-sum{min-width:0;flex:1;font-size:14px}
.ab-sum b{font-size:16px}

/* status */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-pending{background:var(--pending-soft);color:var(--pending)}
.st-keying{background:var(--keying-soft);color:var(--keying)}
.st-done{background:var(--done-soft);color:var(--done)}
.st-returned{background:var(--bad-soft);color:var(--bad)}
.st-cancelled{background:var(--mute-soft);color:var(--muted)}

/* case list */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.toolbar .field{width:auto}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.case{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;border-left:4px solid var(--line)}
.case:hover{border-color:var(--accent)}
.case.s-pending{border-left-color:var(--pending)} .case.s-keying{border-left-color:var(--keying)}
.case.s-done{border-left-color:var(--done)} .case.s-returned{border-left-color:var(--bad)} .case.s-cancelled{opacity:.6}
.case.sel{outline:2px solid var(--accent);outline-offset:-1px}
.case-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.case-room{font-family:var(--f-display);font-weight:700;font-size:16px}
.case-sub{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.reason{font-size:13px;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:6px 10px}

/* keyer */
.k-grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px;align-items:start}
.k-list{display:flex;flex-direction:column;gap:8px}
.k-detail{position:sticky;top:120px}
.sheet-h{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-bottom:12px}
.sheet-h .big{font-family:var(--f-display);font-size:24px;font-weight:700}
.kv{display:flex;flex-direction:column}
.kv span:first-child{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.kv span:last-child{font-weight:600}
.his{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
.his-h{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 12px;background:var(--surface2);font-weight:600;font-size:14px;border-bottom:1px solid var(--line)}
.ln{display:grid;grid-template-columns:28px minmax(92px,auto) minmax(0,1fr) 56px 40px;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer}
.his-h + .ln{border-top:0}
.ln.ok{background:var(--done-soft)}
.ln.ok .ln-name,.ln.ok .ln-code{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--done) 60%,transparent)}
.ln input{width:20px;height:20px;accent-color:var(--done)}
.ln-code{font-family:var(--f-mono);font-size:18px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.ln-code.none{font-family:var(--f-body);font-size:13px;color:var(--bad)}
.ln-name{min-width:0;overflow-wrap:anywhere}
.ln-qty{font-family:var(--f-mono);font-size:20px;font-weight:600;text-align:right}
.copy{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:36px;height:32px;display:grid;place-items:center}
.copy svg{width:16px;height:16px}
.k-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.progress{height:6px;background:var(--mute-soft);border-radius:4px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--done);transition:width .2s}
.k-close{display:none}

/* summary */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;background:var(--surface2)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.zero td{color:var(--muted)}
tfoot td{font-weight:700;background:var(--surface2)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-family:var(--f-mono);font-size:26px;line-height:1.2}
.tile span{font-size:13px;color:var(--muted)}
.tile.p b{color:var(--pending)} .tile.r b{color:var(--bad)} .tile.d b{color:var(--done)}
.sec{margin-top:22px}

/* modal + toast */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,16,22,.45);display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none!important}
.modal{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal h3{font-family:var(--f-display);margin:0 0 10px;font-size:19px}
.warns{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.w{border-radius:8px;padding:8px 12px;font-size:14px}
.w.err{background:var(--bad-soft);color:var(--bad);font-weight:500}
.w.warn{background:var(--pending-soft);color:var(--ink)}
.w.warn b{color:var(--pending)}
.rv{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rv div{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;gap:8px;padding:6px 10px;border-top:1px solid var(--line);font-size:14px}
.rv div:first-child{border-top:0}
.rv .h{background:var(--surface2);font-weight:600;font-size:12.5px;color:var(--muted);display:block}
.rv .q{text-align:right;font-family:var(--f-mono);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (min-width:700px){.ov{align-items:center}.modal{border-radius:16px}}
@media (max-width:860px){
  .send-grid,.k-grid{grid-template-columns:minmax(0,1fr)}
  .k-detail{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));display:none}
  .k-detail.open{display:block}
  .k-close{display:inline-flex}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .grid3{grid-template-columns:1fr 1fr}
  .ln{grid-template-columns:24px minmax(0,1fr) 44px 36px;row-gap:2px}
  .ln-code{grid-column:2;font-size:17px}
  .ln-name{grid-column:2;grid-row:2;font-size:13.5px}
  .ln-qty{grid-column:3;grid-row:1/3}
  .copy{grid-column:4;grid-row:1/3}
  .ln input{grid-row:1/3}
}
</style>
</head>
<body>

const MEM = {};
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v==null?(k in MEM?MEM[k]:d):JSON.parse(v);}catch(e){ return k in MEM?MEM[k]:d; } }
function lsSet(k,v){ MEM[k]=v; try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
function today(){ const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function nowHM(){ const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function nowISO(){ return new Date().toISOString(); }
function hm(iso){ if(!iso) return ""; const d=new Date(iso); return isNaN(d)?"":pad(d.getHours())+":"+pad(d.getMinutes()); }
function thDate(s){ if(!s) return ""; const [y,m,d]=s.split("-").map(Number); const M=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."]; return d+" "+M[m-1]+" "+String(y+543).slice(2); }
function uid(){ try{ return crypto.randomUUID(); }catch(e){ return "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); } }
function minutesBetween(a,b){ if(!a||!b) return null; const [h1,m1]=a.split(":").map(Number),[h2,m2]=b.split(":").map(Number); let d=(h2*60+m2)-(h1*60+m1); if(d<0) d+=1440; return d; }
function durTxt(m){ if(m==null) return "—"; const h=Math.floor(m/60), r=m%60; return (h?h+" ชม. ":"")+r+" นาที"; }

/* ---------- API (Apps Script หรือโหมดทดลองในเครื่อง) ---------- */
async function api(action, data){
  data = data || {};
  if (!isLive()) return localApi(action, data);
  const res = await fetch(settings.api, {method:"POST", body: JSON.stringify(Object.assign({action, pin:settings.pin}, data))});
  if (!res.ok) throw new Error("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ("+res.status+")");
  const j = await res.json();
  if (!j.ok){
    if (/PIN/.test(j.error||"") && !S.pinAsked && $("#ov").hidden){ S.pinAsked=true; setTimeout(()=>openSettings(settings.pin?"รหัสทีม (APP PIN) ไม่ถูกต้อง กรุณาใส่รหัสใหม่":"กรุณาใส่รหัสทีม (APP PIN) ก่อนใช้งาน ขอรหัสได้จากหัวหน้า", true),0); }
    throw new Error(j.error || "เกิดข้อผิดพลาด");
  }
  return j.data;
}
const EDITABLE = ["pending","returned"];
function localApi(action, d){
  let all = lsGet("ab_cases", null);
  if (all === null){ all = demoSeed(); lsSet("ab_cases", all); }
  const save = () => lsSet("ab_cases", all);
  const find = id => all.find(c=>c.id===id);
  switch(action){
    case "list":
      if (d.backlog) return all.filter(c=>c.status==="pending"||c.status==="keying"||c.status==="returned");
      if (d.month) return all.filter(c=>c.date.startsWith(d.month));
      return all.filter(c=>c.date===d.date);
    case "save": {
      const c = d.case;
      if (!c.id){ c.id=uid(); c.status="pending"; c.sentAt=nowISO(); c.updatedAt=c.sentAt; all.push(c); save(); return c; }
      const cur = find(c.id); if(!cur) throw new Error("ไม่พบเคสนี้");
      if (!EDITABLE.includes(cur.status)) throw new Error("เคสนี้ผู้คีย์รับไปแล้ว แก้ไขไม่ได้ ใช้ 'ส่งรายการเพิ่ม' แทน");
      Object.assign(cur, c, {status:"pending", returnReason:"", updatedAt:nowISO()}); save(); return cur;
    }
    case "status": {
      const cur = find(d.id); if(!cur) throw new Error("ไม่พบเคสนี้");
      checkTransition(cur, d); applyTransition(cur, d); save(); return cur;
    }
    case "deleteMonth": { const n=all.length; all = all.filter(c=>!c.date.startsWith(d.month)); save(); return {deleted:n-all.length}; }
    case "config": return null;
  }
  throw new Error("unknown action");
}
/* กติกาเปลี่ยนสถานะ (ฝั่งเซิร์ฟเวอร์ใช้กติกาเดียวกัน) */
function checkTransition(cur, d){
  const from = cur.status, to = d.status;
  const ok = {
    keying:   ["pending"],
    done:     ["pending","keying"],
    returned: ["pending","keying"],
    cancelled:["pending","returned"],
    pending:  ["keying"]           // ผู้คีย์ปล่อยคืนคิว
  }[to] || [];
  if (from===to && to==="keying" && cur.keyer===d.by) return;
  if (!ok.includes(from)) throw new Error("สถานะเคสเปลี่ยนไปแล้ว ("+(STATUS[from]||from)+") กรุณารีเฟรช");
}
function applyTransition(cur, d){
  const t = nowISO(); cur.status=d.status; cur.updatedAt=t;
  if (d.status==="keying"){ cur.keyer=d.by; cur.keyStart=t; }
  if (d.status==="done"){ cur.keyer=d.by; cur.keyedAt=t; }
  if (d.status==="returned"){ cur.returnReason=d.reason||""; cur.returnedBy=d.by; }
  if (d.status==="pending"){ cur.keyer=""; cur.keyStart=""; }
  if (d.status==="cancelled"){ cur.cancelledBy=d.by; }
}

/* ---------- auto charge by time ---------- */
function autoItems(type, minutes){
  const a = ANES.find(x=>x.k===type); if(!a) return [];
  const out=[], add=(code,qty)=>{ const it=BYCODE[code]; if(it && qty>0) out.push({id:it.id,code:it.code,name:it.name,sec:it.sec,qty}); };
  const timed = minutes!=null && minutes>0;
  if (a.extra) Object.entries(a.extra).forEach(([c,v])=>{ if(v!=="hour") add(c,v); });   // รายการคงที่ (CO2, Warmer) ใส่ทันทีที่เลือกชนิด
  if (!timed) return out;
  if (a.first){ add(a.first,1); const ex=minutes-60; if(ex>0) add(a.next, Math.ceil(ex/15)); }
  if (a.perHour) add(a.perHour, Math.max(1,Math.ceil(minutes/60)));
  if (a.once) add(a.once,1);
  if (a.extra) Object.entries(a.extra).forEach(([c,v])=>{ if(v==="hour") add(c, Math.max(1,Math.ceil(minutes/60))); });
  return out;
}
function timeExplain(type, minutes){
  const a = ANES.find(x=>x.k===type);
  if (!a) return "เลือกชนิดการระงับความรู้สึก แล้วกรอกเวลา";
  if (a.k==="OTHER") return "ไม่คิดค่าบริการตามเวลา";
  if (minutes==null) return "กรอกเวลาเริ่ม–สิ้นสุด แล้วระบบคิดค่าบริการตามเวลาให้";
  if (a.first){ const ex=minutes-60; return ex>0 ? `ชม.แรก 1 + ถัดไป <b>${Math.ceil(ex/15)}</b> × 15 นาที` : "ชม.แรก 1"; }
  if (a.perHour) return `TIVA <b>${Math.max(1,Math.ceil(minutes/60))}</b> ชม.`;
  return "คิด 1 ครั้ง";
}

/* เวลา: พิมพ์ 0900, 900, 9, 9:00 หรือ 9.00 ได้ แอปจัดรูปแบบเป็น 09:00 ให้ */
function normTime(v){
  v=String(v||"").trim(); if(!v) return "";
  let h,m; const sp=v.split(/[:.\s]/);
  if (sp.length===2){ h=sp[0]; m=sp[1]||"0"; }
  else { const d=v.replace(/\D/g,""); if(!d||d.length>4) return null;
    if(d.length<=2){ h=d; m="0"; } else { h=d.slice(0,d.length-2); m=d.slice(-2); } }
  if(!/^\d{1,2}$/.test(h)||!/^\d{1,2}$/.test(m)) return null;
  h=+h; m=+m; if(h>23||m>59) return null;
  return pad(h)+":"+pad(m);
}
function commitTime(el, k){
  const t=normTime(el.value);
  if (t===null){ el.setAttribute("aria-invalid","true"); toast("เวลาไม่ถูกต้อง พิมพ์ 4 หลัก เช่น 0900 หรือ 1345"); return false; }
  el.removeAttribute("aria-invalid"); el.value=t;
  if (S.draft[k]!==t){ S.draft[k]=t; recomputeAuto(); saveDraft(); renderTime(); renderItems(); }
  return true;
}

    if (/^\d{4}$/.test(el.value) && commitTime(el,k)){ if(next) $(next).focus(); else el.blur(); } });
  el.addEventListener("change",()=>commitTime(el,k));
  el.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); if(commitTime(el,k)){ if(next) $(next).focus(); else el.blur(); } } });
});

function validate(){

    if (timed && (!d.start||!d.end)) errs.push("ยังไม่ได้กรอกเวลาเริ่ม/สิ้นสุด จึงคิดค่าบริการตามเวลาไม่ได้");

}

  const cs=keyVisible();

/* ---------- SUMMARY ---------- */
function tally(cs){
  const by=new Map(), mk=r=>({room:r,total:0,pending:0,keying:0,returned:0,done:0,cancelled:0,items:0});
  ROOMS.forEach(r=>by.set(r,mk(r)));
  cs.forEach(c=>{ if(!by.has(c.room)) by.set(c.room,mk(c.room)); const r=by.get(c.room); r[c.status]=(r[c.status]||0)+1; if(c.status!=="cancelled"){ r.total++; r.items+=(c.items||[]).length; } });
  return [...by.values()];
}

  $("#sDate").value ||= today(); $("#mMonth").value ||= today().slice(0,7);

    $("#sTable").innerHTML = `<thead><tr><th>จุดบริการ</th><th class="n">เคส</th><th class="n">รอคีย์</th><th class="n">กำลังคีย์</th><th class="n">ส่งกลับ</th><th class="n">คีย์แล้ว</th><th class="n">ยกเลิก</th><th class="n">รายการ</th></tr></thead><tbody>`+
      rows.map(r=>`<tr class="${r.total?"":"zero"}"><td>${esc(r.room)}</td><td class="n">${r.total}</td><td class="n">${r.pending||""}</td><td class="n">${r.keying||""}</td><td class="n">${r.returned||""}</td><td class="n">${r.done||""}</td><td class="n">${r.cancelled||""}</td><td class="n">${r.items||""}</td></tr>`).join("")+
      `</tbody><tfoot><tr><td>รวม</td><td class="n">${T.total}</td><td class="n">${T.pending}</td><td class="n">${T.keying}</td><td class="n">${T.returned}</td><td class="n">${T.done}</td><td class="n">${T.cancelled}</td><td class="n">${T.items}</td></tr></tfoot>`;
  }catch(e){ $("#sTable").innerHTML=`<tbody><tr><td>${esc(e.message)}</td></tr></tbody>`; }

    const cs=(await api("list",{month:mo})).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:ROOMS.indexOf(a.room)-ROOMS.indexOf(b.room)||(+a.caseNo-+b.caseNo));
    const caseRows=cs.map(c=>({"วันที่":c.date,"จุดบริการ":c.room,"เคสที่":+c.caseNo||c.caseNo,"HN":c.hn,"Dr.Anes":c.doctor||"","ชนิด":anesLabel(c.anesType),"เริ่ม":c.start,"สิ้นสุด":c.end,"นาที":c.minutes,"จำนวนรายการ":(c.items||[]).length,"สถานะ":STATUS[c.status]||c.status,"ผู้ส่ง":c.sender,"เวลาส่ง":hm(c.sentAt),"ผู้คีย์":c.keyer||"","เวลาคีย์เสร็จ":hm(c.keyedAt),"เหตุผลส่งกลับ":c.returnReason||"","รายการเพิ่ม":c.parentId?"ใช่":"","หมายเหตุ":c.note||""}));
    const itemRows=[]; cs.forEach(c=>(c.items||[]).forEach(i=>itemRows.push({"วันที่":c.date,"จุดบริการ":c.room,"เคสที่":+c.caseNo||c.caseNo,"HN":c.hn,"หมวด":i.sec==="anes"?"วิสัญญี":"ยา/เวชภัณฑ์","รหัส":i.code,"รายการ":i.name,"จำนวน":+i.qty,"อัตโนมัติ":i.auto?"ใช่":"","สถานะเคส":STATUS[c.status]||c.status,"ผู้คีย์":c.keyer||""})));
    const roomRows=tally(cs).map(r=>({"จุดบริการ":r.room,"เคส":r.total,"คีย์แล้ว":r.done,"ค้าง":r.pending+r.keying+r.returned,"ยกเลิก":r.cancelled,"รายการ":r.items}));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(caseRows),"เคส");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(itemRows),"รายการ");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(roomRows),"สรุปรายจุด");
    XLSX.writeFile(wb,`AnesBill_${mo}.xlsx`);
    msg.textContent=`ดาวน์โหลด AnesBill_${mo}.xlsx (${cs.length} เคส, ${itemRows.length} รายการ) ถ้าไฟล์ไม่ขึ้น ให้เปิดแอปจากลิงก์ใช้งานจริง`;
  }catch(e){ msg.textContent=e.message; }
});
$("#delBtn").addEventListener("click",()=>{
  const mo=$("#mMonth").value; if(!mo) return;
  openModal(`<h3>ล้างข้อมูลเดือน ${esc(mo)}</h3>
    <p>ทุกเคสในเดือนนี้จะถูกลบออกจากระบบถาวร <b>ดาวน์โหลด Excel เก็บไว้ก่อน</b></p>
    <div class="stack">
      <label class="field"><span class="label">พิมพ์ ${esc(mo)} เพื่อยืนยัน</span><input class="input mono" id="cfm" autocomplete="off"></label>
      ${isLive()?'<label class="field"><span class="label">รหัสผู้ดูแล (ADMIN PIN)</span><input class="input mono" id="apin" type="password" autocomplete="off"></label>':""}
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-close>ยกเลิก</button><button class="btn danger" id="doDel">ลบข้อมูลเดือนนี้</button></div>`);
  $("#doDel").onclick=async()=>{
    if ($("#cfm").value.trim()!==mo){ toast("พิมพ์เดือนให้ตรงก่อน"); return; }
    try{ const r=await api("deleteMonth",{month:mo,adminPin:($("#apin")||{}).value||""}); closeModal(); toast(`ลบแล้ว ${r.deleted} เคส`); loadSum(); refreshBadge(); }catch(e){ toast(e.message); }
  };
});

/* ---------- modal / settings ---------- */
function openModal(html){ $("#modal").innerHTML=html; $("#ov").hidden=false; }
function closeModal(){ $("#ov").hidden=true; $("#modal").innerHTML=""; }
$("#ov").addEventListener("click",e=>{ if(e.target.id==="ov"||e.target.closest("[data-close]")) closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("#ov").hidden) closeModal(); });
function confirmBox(title,body,okText,fn){
  openModal(`<h3>${esc(title)}</h3><p>${esc(body)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-close>กลับ</button><button class="btn danger" id="cbOk">${esc(okText)}</button></div>`);
  $("#cbOk").onclick=fn;
}
function keyerCls(c){ return c.status==="keying"?"nm-keying":c.status==="done"?"nm-done":"nm-other"; }
function renderWho(){
  const w=$("#whoBtn"), nm=settings.name;
  w.classList.toggle("unset", !nm);
  w.innerHTML = `<span class="av">${nm?esc([...nm][0]):"?"}</span><span>${esc(nm||"ตั้งชื่อผู้ใช้")}${settings.room?" · "+esc(settings.room):""}</span>`;
  $("#demoBanner").hidden = isLive();
}
function openSettings(msg, focusPin){
  openModal(`<h3>ตั้งค่า</h3>${msg?`<div class="w warn" style="margin-bottom:10px">${esc(msg)}</div>`:""}
  <div class="stack">
    <label class="field"><span class="label">ชื่อ (แสดงเป็นผู้ส่ง / ผู้คีย์)</span><input class="input" id="stName" value="${esc(settings.name)}" placeholder="เช่น ปุ๊ วสญ."></label>
    <label class="field"><span class="label">จุดประจำ (ค่าเริ่มต้นของฟอร์ม)</span><select class="input" id="stRoom"><option value="">— ไม่ระบุ —</option>${ROOMS.map(r=>`<option ${r===settings.room?"selected":""}>${esc(r)}</option>`).join("")}</select></label>
    <label class="row" style="gap:10px"><input type="checkbox" id="stNs" ${settings.copyNoSpace?"checked":""} style="width:18px;height:18px"> <span>ปุ่มคัดลอกรหัส ตัดช่องว่างออก (70 110 → 70110)</span></label>
    <details ${!isLive()||!settings.pin||focusPin?"open":""}><summary style="cursor:pointer;font-weight:600">การเชื่อมต่อ (ลิงก์และรหัสทีม)</summary>
      <div class="stack" style="margin-top:10px">
        <label class="field"><span class="label">ลิงก์ Apps Script Web App</span><input class="input mono" id="stApi" value="${esc(settings.api)}" placeholder="https://script.google.com/macros/s/…/exec" style="font-size:13px"></label>
        <label class="field"><span class="label">รหัสทีม (APP PIN)</span><input class="input mono" id="stPin" type="password" value="${esc(settings.pin)}" autocomplete="off"></label>
        <p class="muted" style="margin:0;font-size:13px">เว้นลิงก์ว่างไว้ = โหมดทดลอง ข้อมูลอยู่ในเครื่องนี้เท่านั้น</p>
      </div></details>
  </div>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-close>ปิด</button><button class="btn primary" id="stSave">บันทึก</button></div>`);
  if (focusPin) setTimeout(()=>{ const el=$("#stPin"); if(el){ el.focus(); el.setAttribute("aria-invalid","true"); } },50);
  $("#stSave").onclick=async()=>{ S.pinAsked=false;
    settings.name=$("#stName").value.trim(); settings.room=$("#stRoom").value; settings.copyNoSpace=$("#stNs").checked;
    const api0=settings.api, pin0=settings.pin; settings.api=$("#stApi").value.trim(); settings.pin=$("#stPin").value;
    lsSet("ab_settings",settings); closeModal(); renderWho();
    if (settings.room && !S.draft.id && !S.draft.hn){ S.draft.room=settings.room; S.draft.caseNo=""; saveDraft(); }
    if (settings.api && (settings.api!==api0 || settings.pin!==pin0)){ try{ await api("ping"); toast("เชื่อมต่อสำเร็จ"); await loadConfig(); }catch(e){ toast("เชื่อมต่อไม่ได้: "+e.message); } }
    else toast("บันทึกแล้ว");
    setTab(S.tab);
  };
}
$("#whoBtn").addEventListener("click",()=>openSettings());
async function loadConfig(){
  if (!isLive()) return;
  try{ const c=await api("config"); if(c){ if(c.items&&c.items.length){ ITEMS=c.items; indexItems(); } if(c.rooms&&c.rooms.length) ROOMS=c.rooms; } }catch(e){}
}

/* ---------- boot ---------- */
setInterval(()=>{ if(document.visibilityState!=="visible" || !$("#ov").hidden) return;
  if(S.tab==="key") loadKey(true); else if(S.tab==="room") loadRoom(); else if(S.tab==="sum") loadSum(); else refreshBadge(); }, CONFIG.POLL_SECONDS*1000);
(async()=>{
  renderWho();
  await loadConfig();
  if (!ROOMS.includes(S.draft.room)) S.draft.room=settings.room||ROOMS[0];
  setTab(S.tab); refreshBadge();
  if (isLive() && !settings.name) openSettings("ยินดีต้อนรับ ใส่ชื่อ จุดประจำ และรหัสทีม (APP PIN) ก่อนเริ่มใช้งาน");
})();
try{ if ("serviceWorker" in navigator && location.protocol==="https:" && !/claude|claudeusercontent/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
</script>
